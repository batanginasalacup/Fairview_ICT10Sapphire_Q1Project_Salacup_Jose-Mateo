<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #skuOutput {
            margin-top: 25px;
            padding: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .navigation {
            text-align: center;
            margin-bottom: 20px;
        }

        .navigation a {
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="navigation">
            <a href="index.html">Receipt Generator</a>
            <a href="sku.html">SKU Generator</a>
        </div>

        <h1>SKU Generator</h1>

        <label>Product Category</label>
        <input type="text" id="category" placeholder="Example: Shirt">

        <label>Product Name</label>
        <input type="text" id="productName" placeholder="Example: Oversized">

        <label>Stock Quantity</label>
        <input type="number" id="stockQuantity" min="0" placeholder="Example: 25">

        <button py-click="generate_sku">
            Generate SKU
        </button>

        <div id="skuOutput"></div>

    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
